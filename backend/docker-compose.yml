services:
  frontend:
    build:
      context: ..
      dockerfile: backend/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-colo_manager}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      JWT_TTL: ${JWT_TTL:-3600}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-300}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@colomanager.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-COLO MANAGER}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@colomanager.local}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-developer@colomanager.local}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@colomanager.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-demo@colomanager.local}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Demo123!}
      SEED_TECHNICIAN_EMAIL: ${SEED_TECHNICIAN_EMAIL:-technik@colomanager.local}
      SEED_TECHNICIAN_PASSWORD: ${SEED_TECHNICIAN_PASSWORD:-Staff123!}
      SEED_SALES_EMAIL: ${SEED_SALES_EMAIL:-vertrieb@colomanager.local}
      SEED_SALES_PASSWORD: ${SEED_SALES_PASSWORD:-Staff123!}
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  onboarding-reminder:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "bin/send-onboarding-reminders.php", "--loop"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-colo_manager}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      JWT_TTL: ${JWT_TTL:-3600}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-300}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@colomanager.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-COLO MANAGER}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@colomanager.local}
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongodb_data:
  mailpit_data:
