server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative Redirects behalten den vom Browser verwendeten Host und Port.
    # Das ist insbesondere für den lokalen Aufruf über localhost:3000 wichtig.
    absolute_redirect off;

    # Bis zu fünf Ticketdateien à 10 MB plus Formulardaten dürfen den Proxy
    # passieren. Die API erzwingt die Grenze anschließend pro Datei erneut.
    client_max_body_size 52m;

    # Das Frontend spricht die API über dieselbe Origin an. Dadurch funktionieren
    # Login, Admin und Statusseite auch hinter Reverse Proxies und auf anderen
    # Host-Ports, ohne hart codierte localhost-Adressen.
    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Die öffentliche Startadresse verwendet die Angebotsseite als kanonische
    # Landingpage. Durch die Weiterleitung ist auch in der Adresszeile immer
    # /angebote.html sichtbar.
    location = / {
        return 302 /angebote.html;
    }

    location = /dashboard {
        try_files /index.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /kunde {
        try_files /kunde.html =404;
    }

    location = /kunde.html {
        try_files /kunde.html =404;
    }

    location = /angebote {
        return 302 /angebote.html;
    }

    location = /angebot {
        try_files /angebot.html =404;
    }

    location = /angebot.html {
        try_files /angebot.html =404;
    }

    location = /vertrag {
        try_files /vertrag.html =404;
    }

    location = /vertrag.html {
        try_files /vertrag.html =404;
    }

    location = /konto-aktivieren {
        try_files /konto-aktivieren.html =404;
    }

    location = /konto-aktivieren.html {
        try_files /konto-aktivieren.html =404;
    }

    location = /passwort-vergessen {
        try_files /passwort-vergessen.html =404;
    }

    location = /passwort-vergessen.html {
        try_files /passwort-vergessen.html =404;
    }

    location = /passwort-zuruecksetzen {
        try_files /passwort-zuruecksetzen.html =404;
    }

    location = /passwort-zuruecksetzen.html {
        try_files /passwort-zuruecksetzen.html =404;
    }

    location = /status {
        try_files /status.html =404;
    }

    location = /status.html {
        try_files /status.html =404;
    }

    location = /tickets {
        try_files /tickets.html =404;
    }

    location = /tickets.html {
        try_files /tickets.html =404;
    }

    location = /dokumente {
        try_files /dokumente.html =404;
    }

    location = /dokumente.html {
        try_files /dokumente.html =404;
    }

    location = /racks {
        try_files /racks.html =404;
    }

    location = /racks.html {
        try_files /racks.html =404;
    }

    location = /rackbelegung {
        try_files /rackbelegung.html =404;
    }

    location = /rackbelegung.html {
        try_files /rackbelegung.html =404;
    }

    location = /netzwerk {
        try_files /netzwerk.html =404;
    }

    location = /netzwerk.html {
        try_files /netzwerk.html =404;
    }

    location = /api-dokumentation {
        try_files /api-dokumentation.html =404;
    }

    location = /api-dokumentation.html {
        try_files /api-dokumentation.html =404;
    }

    location = /konto {
        try_files /konto.html =404;
    }

    location = /konto.html {
        try_files /konto.html =404;
    }

    # Die Sitzungslogik wird bei Sicherheitskorrekturen sofort neu geladen.
    # HTML referenziert zusätzlich eine Versionskennung gegen Browser-Caches.
    location = /session-manager.js {
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
        try_files /session-manager.js =404;
    }

    location / {
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Lokale Portaldateien dürfen nicht aus einer veralteten Safari-/Browser-
    # Version wiederhergestellt werden. Das verhindert alte Auth-Guards und
    # null-Sitzungen nach einem Sicherheitsupdate.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
